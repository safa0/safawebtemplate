<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#111111"/>
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Penrose triangle mark (centered, subtle) -->
  <g transform="translate(490, 80) scale(0.42)" opacity="0.9">
    <polygon points="60,100 200,100 280,240 256,280 140,280 100,210 160,210 176,240 220,160 120,160" fill="white"/>
    <polygon points="452,100 312,100 232,240 256,280 372,280 412,210 352,210 336,240 292,160 392,160" fill="white"/>
    <polygon points="140,280 372,280 336,340 312,340 256,420 200,340 176,340" fill="white"/>
    <polygon points="256,200 210,280 302,280" fill="#111111"/>
  </g>
  <!-- Programme name -->
  <text x="600" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="48" font-weight="700" fill="white" letter-spacing="2">Gradient Fellows</text>
  <!-- Tagline -->
  <text x="600" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="white" opacity="0.5" letter-spacing="3">STEM TO AI FELLOWSHIP</text>
  <!-- Bottom data strip -->
  <text x="350" y="550" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="white" opacity="0.7">$200/mo</text>
  <text x="350" y="575" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white" opacity="0.4" letter-spacing="1">STIPEND</text>
  <text x="600" y="550" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="white" opacity="0.7">3-12mo</text>
  <text x="600" y="575" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white" opacity="0.4" letter-spacing="1">TO JOB-READY</text>
  <text x="850" y="550" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="white" opacity="0.7">$0</text>
  <text x="850" y="575" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white" opacity="0.4" letter-spacing="1">TUITION</text>
  <!-- Dividers -->
  <line x1="475" y1="535" x2="475" y2="580" stroke="white" stroke-width="0.5" opacity="0.15"/>
  <line x1="725" y1="535" x2="725" y2="580" stroke="white" stroke-width="0.5" opacity="0.15"/>
</svg>
